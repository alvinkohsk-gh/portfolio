name: Price alerts

on:
  schedule:
    # Every 15 minutes. GitHub disables scheduled workflows automatically
    # after 60 days without any commits to the repository - push something
    # (even unrelated) before then to keep it alive.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Call price-alerts endpoint
        run: |
          # For a plain server-to-server request, the protection-bypass
          # header alone grants direct access - no redirect, no cookie
          # needed (that cookie header is only for browser sessions, and
          # combining it with -L here caused an infinite redirect loop
          # since curl doesn't persist cookies across hops without -c/-b).
          # --fail-with-body surfaces the real error body (instead of a
          # bare non-zero exit) if a check ever rejects the request again.
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_PROTECTION_BYPASS }}" \
            https://portfolio-aksk1.vercel.app/api/price-alerts
